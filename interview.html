<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>甄選面談評分表 產生器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --ink:#1c2b2b;
    --paper:#f6f4ee;
    --card:#ffffff;
    --teal:#1f5f5b;
    --teal-deep:#123c39;
    --clay:#c76a4f;
    --line:#dcd6c8;
    --muted:#6b7570;
  }
  *{box-sizing:border-box;}
  #app-root{
    font-family:"Noto Sans TC","Microsoft JhengHei",-apple-system,sans-serif;
    color:var(--ink);
    background:var(--paper);
    min-height:100%;
    padding:28px 20px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto;}
  .masthead{
    display:flex;align-items:flex-end;justify-content:space-between;
    border-bottom:3px solid var(--teal-deep);
    padding-bottom:16px;margin-bottom:22px;flex-wrap:wrap;gap:12px;
  }
  .masthead h1{
    font-size:26px;margin:0 0 4px;letter-spacing:.5px;color:var(--teal-deep);
    font-weight:800;
  }
  .masthead p{margin:0;color:var(--muted);font-size:13px;letter-spacing:1px;}
  .eyebrow{
    font-size:11px;letter-spacing:3px;color:var(--clay);font-weight:700;
    text-transform:uppercase;margin-bottom:6px;
  }
  .grid{display:grid;grid-template-columns:1fr 300px;gap:22px;}
  @media (max-width:900px){.grid{grid-template-columns:1fr;}}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:20px 22px;margin-bottom:18px;
  }
  .card h2{
    font-size:14px;margin:0 0 14px;color:var(--teal-deep);
    letter-spacing:1px;border-left:4px solid var(--clay);padding-left:10px;
  }
  .field-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-bottom:12px;}
  .field-row.two{grid-template-columns:1fr 1fr;}
  .field-row.three{grid-template-columns:1fr 1fr 1fr;}
  @media (max-width:700px){.field-row,.field-row.two,.field-row.three{grid-template-columns:1fr;}}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;
    font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink);
  }
  input:focus,textarea:focus,select:focus{outline:2px solid var(--teal);outline-offset:1px;}
  textarea{resize:vertical;min-height:44px;}
  .score-table{width:100%;border-collapse:collapse;margin-bottom:6px;}
  .score-table th{
    font-size:11px;color:var(--muted);font-weight:600;padding:4px 2px;text-align:center;
  }
  .score-table td{padding:6px 2px;text-align:center;font-size:12.5px;}
  .score-table td.label{text-align:left;padding-right:8px;font-size:13px;}
  .score-table select{padding:4px;font-size:12.5px;}
  .radio-group{display:flex;gap:14px;flex-wrap:wrap;padding-top:4px;}
  .radio-group label{
    display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink);
    font-weight:400;margin:0;cursor:pointer;
  }
  .radio-group input{width:auto;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;align-items:center;}
  button{
    font-family:inherit;border:none;border-radius:7px;padding:10px 18px;
    font-size:13.5px;font-weight:700;cursor:pointer;letter-spacing:.5px;
  }
  button:disabled{opacity:.55;cursor:not-allowed;}
  .btn-primary{background:var(--teal-deep);color:#fff;}
  .btn-primary:hover{background:var(--teal);}
  .btn-ghost{background:transparent;color:var(--teal-deep);border:1px solid var(--teal-deep);}
  .btn-ghost:hover{background:#eef3f2;}
  .btn-danger{background:transparent;color:#a03e2c;border:1px solid #d8b4a8;}
  .btn-danger:hover{background:#fbeee9;}
  .btn-small{padding:5px 10px;font-size:11.5px;border-radius:5px;}
  .status-pill{
    display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;
    background:#eef3f2;color:var(--teal-deep);font-weight:700;
  }
  .record-item{
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;
    background:#fdfcf9;
  }
  .record-item.active{border-color:var(--teal);background:#eef6f5;}
  .record-name{font-weight:700;font-size:13.5px;color:var(--teal-deep);}
  .record-meta{font-size:11.5px;color:var(--muted);margin:2px 0 8px;}
  .record-actions{display:flex;gap:6px;}
  .empty-note{font-size:12.5px;color:var(--muted);text-align:center;padding:18px 4px;}
  .sidebar-sticky{position:sticky;top:20px;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5;}
</style>
</head>

function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === "class") e.className = attrs[k];
    else if(k === "html") e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c => { if(c) e.appendChild(c); });
  return e;
}
function text(t){ return document.createTextNode(t); }

async function loadRecords(){
  try{
    const listRes = await window.storage.list("candidate:", false);
    const keys = (listRes && listRes.keys) || [];
    const records = [];
    for(const k of keys){
      try{
        const r = await window.storage.get(k, false);
        if(r && r.value){
          records.push({id:k, data: JSON.parse(r.value)});
        }
      }catch(e){}
    }
    records.sort((a,b)=> (b.id > a.id ? 1 : -1));
    state.records = records;
  }catch(e){
    state.records = [];
  }
  render();
}

async function saveRecord(){
  const f = state.form;
  if(!f.name || !f.name.trim()){
    alert("請先填寫應徵者姓名再儲存。");
    return;
  }
  const id = state.currentId || ("candidate:" + Date.now());
  try{
    await window.storage.set(id, JSON.stringify(f), false);
    state.currentId = id;
    await loadRecords();
    flashSaved();
  }catch(e){
    alert("儲存失敗，請稍後再試。");
  }
}

async function deleteRecord(id){
  if(!confirm("確定要刪除這筆記錄嗎？此動作無法復原。")) return;
  try{
    await window.storage.delete(id, false);
    if(state.currentId === id){
      state.currentId = null;
      state.form = blankForm();
    }
    await loadRecords();
  }catch(e){
    alert("刪除失敗，請稍後再試。");
  }
}

function loadIntoForm(id){
  const rec = state.records.find(r => r.id === id);
  if(!rec) return;
  state.currentId = id;
  state.form = Object.assign(blankForm(), rec.data);
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

function newForm(){
  state.currentId = null;
  state.form = blankForm();
  render();
}

function escXml(s){
  return (s||"").toString()
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\r?\n/g,"\u3000");
}

function formatROC(dateStr, withWeekday){
  if(!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  if(isNaN(d.getTime())) return dateStr;
  const roc = d.getFullYear() - 1911;
  const m = d.getMonth() + 1;
  const day = d.getDate();
  let out = roc + "年" + m + "月" + day + "日";
  if(withWeekday) out += "（" + WEEKDAY_CHARS[d.getDay()] + "）";
  return out;
}

function buildTokenMap(f){
  const map = {};
  map.DEPT = escXml(f.dept);
  map.POSITION = escXml(f.position);
  map.NAME = escXml(f.name);
  map.INTERVIEW_DATE = escXml(formatROC(f.interviewDate));

  SCORE_ITEMS.forEach(item => {
    ["20","16","12","8","4","0"].forEach(v => {
      map[item.tokPrefix + "_" + v] = (f.scores[item.key] === v) ? "V" : "";
    });
  });

  map.EVAL_GOOD = escXml(f.evalGood);
  map.EVAL_LEARN = escXml(f.evalLearn);
  map.EVAL_CAP = escXml(f.evalCapability);
  map.EVAL_KNOW = escXml(f.evalKnowledge);
  map.EVAL_WEAK = escXml(f.evalWeak);
  map.EVAL_REACT = escXml(f.evalReaction);
  map.EVAL_ATT = escXml(f.evalAttitude);
  map.EVAL_EXP = escXml(f.evalExperience);
  map.EVAL_OVERALL = escXml(f.evalOverall);

  map.R_SUIT = f.result === "suitable" ? "■" : "□";
  map.R_WAIT = f.result === "waitlist" ? "■" : "□";
  map.R_UNSUIT = f.result === "unsuitable" ? "■" : "□";
  map.R_NOTE = f.resultNote ? escXml("\u3000（" + f.resultNote + "）") : "";

  map.PLANNED_DATE = escXml(formatROC(f.plannedDate, true));
  map.SUGGESTED_TITLE = escXml(f.suggestedTitle) + (f.suggestedTitle ? "\u3000" : "");
  map.SUGGESTED_SALARY = escXml(f.suggestedSalary);
  map.P3 = f.probation === "3" ? "■" : "□";
  map.P6 = f.probation === "6" ? "■" : "□";

  map.HR_FT = f.hrType === "FT" ? "■" : "□";
  map.HR_PT = f.hrType === "PT" ? "■" : "□";
  map.HR_INTERN = f.hrType === "intern" ? "■" : "□";
  map.HR_MONTH = f.hrPayType === "month" ? "■" : "□";
  map.HR_HOUR = f.hrPayType === "hour" ? "■" : "□";
  map.HR_CONTRACT = escXml(f.hrContractPeriod);
  map.HR_GRADE = escXml(f.hrGrade);
  map.HR_LEVEL = escXml(f.hrLevel);
  map.HR_TITLE = escXml(f.hrTitle);
  map.HR_ONBOARD = escXml(formatROC(f.hrOnboardDate));

  map.SAL_BASE = escXml(f.salBase);
  map.SAL_MEAL = escXml(f.salMeal);
  map.SAL_POS = escXml(f.salPosition);
  map.SAL_PRO = escXml(f.salPro);
  map.SAL_GRADE_LEVEL = escXml(f.salGradeLevel);
  map.SAL_OTHER1 = escXml(f.salOther1);
  map.SAL_OTHER2 = escXml(f.salOther2);
  map.SAL_HOURLY = escXml(f.salHourly);
  map.SAL_TOTAL = escXml(f.salTotal);

  return map;
}

function replaceTokens(xml, map){
  let out = xml;
  for(const key in map){
    out = out.split(tok(key)).join(map[key]);
  }
  return out;
}

async function generateDocxBlob(f){
  const zip = await JSZip.loadAsync(TEMPLATE_B64, {base64:true});
  const docPath = "word/document.xml";
  let xml = await zip.file(docPath).async("string");
  const map = buildTokenMap(f);
  xml = replaceTokens(xml, map);
  zip.file(docPath, xml);
  return await zip.generateAsync({
    type:"blob",
    mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"
  });
}

async function downloadDoc(){
  const f = state.form;
  if(!f.name || !f.name.trim()){
    alert("請先填寫應徵者姓名再產生文件。");
    return;
  }
  if(typeof JSZip === "undefined"){
    alert("文件產生元件尚未載入完成，請稍等幾秒再試一次。");
    return;
  }
  const dlBtn = document.getElementById("dl-btn");
  if(dlBtn){ dlBtn.disabled = true; dlBtn.textContent = "產生中…"; }
  try{
    const blob = await generateDocxBlob(f);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = (f.name || "面談評分表") + "-甄選面談評分表.docx";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){
    alert("文件產生失敗，請重新整理頁面後再試一次。");
  }finally{
    if(dlBtn){ dlBtn.disabled = false; dlBtn.textContent = "產生並下載 Word 文件"; }
  }
}

function printCandidate(){
  const f = state.form;
  if(!f.name || !f.name.trim()){
    alert("請先填寫應徵者姓名再列印。");
    return;
  }
  const html = buildPrintHtml(f);
  const win = window.open("", "_blank");
  if(!win){
    alert("瀏覽器擋住了新視窗，請允許彈出視窗後再試一次。");
    return;
  }
  win.document.open();
  win.document.write(html);
  win.document.close();
  const doPrint = () => { win.focus(); win.print(); };
  const img = win.document.querySelector("img");
  if(img && !img.complete){
    img.addEventListener("load", doPrint);
    img.addEventListener("error", doPrint);
    setTimeout(doPrint, 1200);
  } else {
    setTimeout(doPrint, 300);
  }
}

function onField(path, value){
  const keys = path.split(".");
  let o = state.form;
  for(let i=0;i<keys.length-1;i++) o = o[keys[i]];
  o[keys[keys.length-1]] = value;
}

function inputField(labelText, path, opts){
  opts = opts || {};
  const keys = path.split(".");
  let val = state.form;
  for(const k of keys) val = val[k];
  const wrap = el("div", {});
  wrap.appendChild(el("label", {}, [text(labelText)]));
  let inputEl;
  if(opts.textarea){
    inputEl = el("textarea", {rows: opts.rows || 2});
    inputEl.value = val || "";
  } else {
    inputEl = el("input", {type: opts.type || "text"});
    inputEl.value = val || "";
  }
  inputEl.addEventListener("input", (e)=>{ onField(path, e.target.value); });
  inputEl.addEventListener("change", (e)=>{ onField(path, e.target.value); });
  wrap.appendChild(inputEl);
  return wrap;
}

function radioGroup(labelText, path, options){
  const keys = path.split(".");
  let val = state.form;
  for(const k of keys) val = val[k];
  const wrap = el("div", {});
  wrap.appendChild(el("label", {}, [text(labelText)]));
  const group = el("div", {class:"radio-group"});
  const name = "rg-" + path.replace(/\./g,"-");
  options.forEach(opt => {
    const id = name + "-" + opt.v;
    const radio = el("input", {type:"radio", name, id, value: opt.v});
    radio.checked = (val === opt.v);
    radio.addEventListener("change", ()=>{ onField(path, opt.v); });
    const lab = el("label", {for:id}, [radio, text(opt.t)]);
    group.appendChild(lab);
  });
  wrap.appendChild(group);
  return wrap;
}

  sideCard.appendChild(el("h2", {}, [text("已儲存記錄")]));
  if(state.records.length === 0){
    sideCard.appendChild(el("div", {class:"empty-note"}, [text("目前沒有已儲存的記錄")]));
  } else {
    state.records.forEach(r => {
      const item = el("div", {class:"record-item" + (state.currentId === r.id ? " active" : "")});
      item.appendChild(el("div", {class:"record-name"}, [text(r.data.name || "（未命名）")]));
      const meta = [r.data.position, r.data.interviewDate].filter(Boolean).join(" · ");
      item.appendChild(el("div", {class:"record-meta"}, [text(meta || "—")]));
      const actions = el("div", {class:"record-actions"});
      const loadBtn = el("button", {class:"btn-ghost btn-small"}, [text("載入")]);
      loadBtn.addEventListener("click", ()=>loadIntoForm(r.id));
      const delBtn = el("button", {class:"btn-danger btn-small"}, [text("刪除")]);
      delBtn.addEventListener("click", ()=>deleteRecord(r.id));
      actions.appendChild(loadBtn);
      actions.appendChild(delBtn);
      item.appendChild(actions);
      sideCard.appendChild(item);
    });
  }
  side.appendChild(sideCard);

  grid.appendChild(main);
  grid.appendChild(side);
  wrap.appendChild(grid);
  root.appendChild(wrap);
}

document.addEventListener("DOMContentLoaded", function(){
  render();
  loadRecords();
});
if(document.readyState !== "loading"){
  render();
  loadRecords();
}
})();
</script>
</body>
</html>
